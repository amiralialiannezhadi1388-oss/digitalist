name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p _zip
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d _zip

          PACKAGE=$(find _zip -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found inside ZIP!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PACKAGE")

          cp -a "$PROJECT_ROOT"/. .

          find . -maxdepth 1 -type f -iname "*.zip" -delete
          rm -rf _zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from ZIP" || echo "Nothing to commit"
          git push
